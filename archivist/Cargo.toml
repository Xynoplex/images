[package]
name = "xynolog-archivist"
workspace = "../packages/rust"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "The Xynolog Archivist: it keeps the knowledge base's record, as protocol/contract/ARCHIVIST.md states it."

[[bin]]
name = "xynolog-archivist"
path = "src/main.rs"

[dependencies]
axum = { workspace = true, features = ["http1", "tokio", "query", "multipart"] }
chrono = { workspace = true, features = ["clock", "std"] }
futures.workspace = true
opentelemetry = { workspace = true, features = ["metrics"] }
percent-encoding.workspace = true
reqwest = { workspace = true, features = ["rustls-no-provider"] }
ring.workspace = true
rustls = { workspace = true, features = ["ring", "std"] }
xynolog.workspace = true
xynolog-archivist-record.workspace = true
xynolog-archivist-staging.workspace = true
xynolog-core.workspace = true
xynolog-http-service.workspace = true
xynolog-http-transport.workspace = true
xynolog-observability.workspace = true
xynolog-telemetry.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
tikv-jemallocator.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs", "io-util"] }
uuid = { workspace = true, features = ["v4"] }
