version: 2

# One pull request per language, twice a month at most: every language's
# updates are one group across its directories, proposed on the 1st and the
# 15th, with no more than one PR open. Rust's crates and toolchain are one
# group across their two ecosystems. A release waits a week before it is
# proposed, and a major release a month where the ecosystem reads semver (not
# GitHub Actions or Docker).

multi-ecosystem-groups:
  rust:
    schedule:
      interval: cron
      cronjob: "0 6 1,15 * *"
    commit-message:
      prefix: deps

updates:
  - package-ecosystem: github-actions
    labels: ["dependencies"]
    directory: /
    schedule:
      interval: cron
      cronjob: "0 6 1,15 * *"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    labels: ["dependencies"]
    directories:
      - /browser
      - /e2e
    schedule:
      interval: cron
      cronjob: "0 6 1,15 * *"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      npm-dependencies:
        patterns: ["*"]
    ignore:
      # TypeScript stays on 6: 7 has no JavaScript API, which the SDK's own
      # build (openapi-typescript) needs, and the products move with the SDK.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: deps

  - package-ecosystem: cargo
    labels: ["dependencies"]
    directory: /packages/rust
    multi-ecosystem-group: rust
    patterns: ["*"]
    cooldown:
      default-days: 7
      semver-major-days: 30

  - package-ecosystem: rust-toolchain
    labels: ["dependencies"]
    directory: /packages/rust
    multi-ecosystem-group: rust
    patterns: ["*"]

  - package-ecosystem: uv
    labels: ["dependencies"]
    directories:
      - /shared/python/graph
      - /shared/python/inference
      - /shared/python/service
      - /shared/python/vectors
      - /worker
      - /smelter
      - /weaver
      - /librarian
    schedule:
      interval: cron
      cronjob: "0 6 1,15 * *"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      python-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: deps

  - package-ecosystem: docker
    labels: ["dependencies"]
    directories:
      - /archivist
      - /browser
      - /dispatcher
      - /gateway
      - /librarian
      - /smelter
      - /weaver
      - /worker
    schedule:
      interval: cron
      cronjob: "0 6 1,15 * *"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      container-base-images:
        patterns: ["*"]
    commit-message:
      prefix: deps
