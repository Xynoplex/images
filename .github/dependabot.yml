version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directories:
      - /browser
      - /e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: deps

  - package-ecosystem: cargo
    directory: /packages/rust
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: deps

  - package-ecosystem: rust-toolchain
    directory: /packages/rust
    schedule:
      interval: weekly
    commit-message:
      prefix: deps

  - package-ecosystem: uv
    directories:
      - /shared/python/graph
      - /shared/python/inference
      - /shared/python/service
      - /shared/python/vectors
      - /worker
      - /smelter
      - /weaver
      - /librarian
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: deps

  - package-ecosystem: docker
    directories:
      - /archivist
      - /browser
      - /dispatcher
      - /gateway
      - /librarian
      - /smelter
      - /weaver
      - /worker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      container-base-images:
        patterns:
          - "*"
    commit-message:
      prefix: deps
