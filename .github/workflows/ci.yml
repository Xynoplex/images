name: Image repository CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sdk:
    name: SDK bundle from the pinned SDK commit
    runs-on: ubuntu-latest
    env:
      SDK_LANGUAGES: typescript python rust
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Read the SDK pin
        id: pin
        run: python3 -c 'import json; print("commit=" + json.load(open("sdk.lock"))["commit"])' >> "$GITHUB_OUTPUT"

      - name: Restore the bundle built from the pin
        id: cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/sdk-artifacts
          key: xynoplex-sdk-${{ steps.pin.outputs.commit }}-${{ env.SDK_LANGUAGES }}

      - name: Check out the pinned SDK
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7.0.1
        with:
          repository: Xynoplex/sdk
          ref: ${{ steps.pin.outputs.commit }}
          path: .xynoplex-sdk
          submodules: recursive

      - name: Build the bundle
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          BUNDLE: ${{ runner.temp }}/sdk-artifacts
        run: |
          built="$(bash .xynoplex-sdk/scripts/resolve-artifact-bundle.sh $SDK_LANGUAGES)"
          cp -a "$built" "$BUNDLE"

      - name: Verify the bundle against the SDK and Protocol pins
        env:
          BUNDLE: ${{ runner.temp }}/sdk-artifacts
          SDK_COMMIT: ${{ steps.pin.outputs.commit }}
        run: |
          languages=()
          for language in $SDK_LANGUAGES; do languages+=(--language "$language"); done
          python3 "$BUNDLE/tools/verify-artifact-bundle.py" "$BUNDLE" \
            --sdk-commit "$SDK_COMMIT" \
            --protocol-commit "$(git ls-tree HEAD protocol | awk '{print $3}')" \
            "${languages[@]}"

      - uses: actions/upload-artifact@v7
        with:
          name: sdk-artifacts
          path: ${{ runner.temp }}/sdk-artifacts
          if-no-files-found: error
          include-hidden-files: true

  checks:
    name: Make help and the image groups
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Make help lists every public target
        run: python3 scripts/test_make_help.py

      # The Rust images share one compile of the Rust workspace, so they build together;
      # every other image takes seconds, less than a job of its own costs.
      - name: Group the Makefile's images
        id: groups
        run: |
          make -pRrq -f Makefile : > "$RUNNER_TEMP/make-database"
          python3 - "$RUNNER_TEMP/make-database" >> "$GITHUB_OUTPUT" <<'PY'
          import json, re, sys
          database = open(sys.argv[1]).read()
          words = lambda name: re.search(rf"^{name} := (.*)$", database, re.M)[1].split()
          rust = words("RUST_IMAGES")
          rest = [image for image in words("IMAGE_NAMES") if image not in rust]
          groups = [{"name": "the Rust images", "images": " ".join(rust)}, {"name": "the other images", "images": " ".join(rest)}]
          print("groups=" + json.dumps(groups))
          PY

  images:
    name: Build ${{ matrix.group.name }}
    needs: [checks, sdk]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.checks.outputs.groups) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Download the SDK bundle
        uses: actions/download-artifact@v8
        with:
          name: sdk-artifacts
          path: ${{ runner.temp }}/sdk-artifacts

      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build the group's images
        env:
          IMAGES: ${{ matrix.group.images }}
          SDK_ARTIFACTS: ${{ runner.temp }}/sdk-artifacts
        run: make $IMAGES
