[package]
name = "xynolog-dispatcher-jetstream"
workspace = "../../packages/rust"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "The dispatcher's job queue on NATS JetStream, behind the handlers' JobQueue contract."

[dependencies]
async-nats = { workspace = true, features = ["ring", "kv", "server_2_10", "nuid"] }
bytes.workspace = true
futures.workspace = true
jiff = { workspace = true, features = ["std"] }
xynolog.workspace = true
xynolog-core = { workspace = true, features = ["nats"] }
xynolog-observability.workspace = true
xynolog-dispatcher-handlers.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }

[build-dependencies]
serde_json.workspace = true
