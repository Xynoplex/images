[package]
name = "xynolog-dispatcher"
workspace = "../packages/rust"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "The Xynolog dispatcher: the knowledge base's job control plane, as protocol/contract/JOBS.md states it."

[[bin]]
name = "xynolog-dispatcher"
path = "src/main.rs"

[dependencies]
axum = { workspace = true, features = ["http1", "tokio"] }
futures.workspace = true
opentelemetry = { workspace = true, features = ["metrics"] }
reqwest = { workspace = true, features = ["rustls-no-provider"] }
rustls = { workspace = true, features = ["ring", "std"] }
xynolog.workspace = true
xynolog-core.workspace = true
xynolog-dispatcher-handlers.workspace = true
xynolog-dispatcher-jetstream.workspace = true
xynolog-http-transport.workspace = true
xynolog-observability.workspace = true
xynolog-telemetry.workspace = true
serde.workspace = true
serde_json.workspace = true
tikv-jemallocator.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
