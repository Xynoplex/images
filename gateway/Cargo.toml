[package]
name = "xynolog-gateway"
workspace = "../packages/rust"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "The Xynolog gateway: authenticates, validates and relays the knowledge base's protocol as protocol/specs/ states it."

[lib]
name = "xynolog_gateway"
path = "src/lib.rs"

[[bin]]
name = "xynolog-gateway"
path = "src/main.rs"

[dependencies]
async-nats = { workspace = true, features = ["ring", "kv", "server_2_10", "nuid"] }
axum = { workspace = true, features = ["http1", "tokio", "query"] }
base64.workspace = true
bytes.workspace = true
futures.workspace = true
http-body.workspace = true
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
jiff = { workspace = true, features = ["std"] }
jsonwebtoken = { workspace = true, features = ["rust_crypto"] }
opentelemetry = { workspace = true, features = ["trace", "metrics"] }
percent-encoding.workspace = true
reqwest = { workspace = true, features = ["rustls-no-provider", "stream", "json"] }
ring.workspace = true
rustls = { workspace = true, features = ["ring", "std"] }
xynolog.workspace = true
xynolog-core = { workspace = true, features = ["nats"] }
xynolog-http-service.workspace = true
xynolog-http-transport.workspace = true
xynolog-observability.workspace = true
xynolog-telemetry.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
socket2.workspace = true
tikv-jemallocator.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util", "fs"] }
tower = { workspace = true, features = ["util"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
# The reads client's retry, and the waits for the Archivist's answers, on tokio's paused clock.
tokio = { workspace = true, features = ["test-util"] }

