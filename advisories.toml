# Published advisories for this repository's dependencies, each judged and
# ignored with why. build-tools/advisories.py, in CI, fails on any finding not
# ignored here and on any ignore that no longer matches a finding.

[[ignore]]
id = "RUSTSEC-2023-0071"
reason = "rsa (the Marvin timing attack) leaks a private key through the time its private-key operations take. The gateway holds no RSA private key: it only verifies the issuer's RS256 signatures, with public keys, and signs its own tokens with HS256. No fixed rsa release exists; it arrives through jsonwebtoken's rust_crypto backend."

[[ignore]]
id = "RUSTSEC-2024-0436"
reason = "paste is unmaintained. It is a procedural macro tikv-jemalloc-ctl uses while it compiles; nothing of it is in the binary."

[[ignore]]
id = "RUSTSEC-2026-0387"
reason = "crypto-bigint 0.5 (operations meant to be constant-time that branch on secret values) leaks what it computes on secret integers. It arrives only through elliptic-curve, for the p256 and p384 that jsonwebtoken's rust_crypto backend links for ES256 and ES384. Nothing here uses either: the gateway signs and verifies its own tokens with HS256, and semiont-http-service verifies the issuer's with RS256, refusing every other algorithm before any key is used. No fixed 0.5 release exists, and jsonwebtoken 11.1.0, its newest, depends on p256 0.13."

[[ignore]]
id = "GHSA-rj75-hqrm-r3gf"
reason = "postcss-selector-parser 6.0.10 (quadratic time on a long flat selector) is pinned exactly by @tailwindcss/typography, whose newest release (0.5.20) still names it. It runs only while the browser image builds, over this repository's own stylesheet; nothing of it is served."

[[ignore]]
id = "GHSA-567q-5qvw-pf92"
reason = "filelock 3.32.7 comes only from the together SDK, which caps it below 4, and every fix is in a 4 release. together locks files only to download fine-tuning files and in its clusters SSH command; the Together provider calls only chat completions, so no lock is ever taken. Each advisory also needs another local user who can write the lock's directory, or Windows; the images run one user on Linux."

